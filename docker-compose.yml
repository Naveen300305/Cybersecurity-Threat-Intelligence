services:
  neo4j:
    image: neo4j:5.20-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/changeme-please
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "changeme-please", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - .:/app
    depends_on:
      neo4j:
        condition: service_healthy

  ui:
    build: ./ui
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./ui:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  neo4j_data:

